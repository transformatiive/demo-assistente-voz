name: inflate-html
on:
  push:
    paths:
      - 'build/**'
      - '.github/workflows/inflate-html.yml'
  workflow_dispatch:
jobs:
  inflate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode CJ and Simon HTML
        run: |
          set -euo pipefail
          mkdir -p public/cj public/simon build
          python3 <<'PY'
          import gzip, base64, pathlib, glob
          def load_payload(stem):
              single = pathlib.Path(f'build/{stem}.b64gz')
              parts = sorted(glob.glob(f'build/{stem}.b64gz.part*'))
              if parts:
                  data = ''.join(pathlib.Path(p).read_text() for p in parts)
              elif single.exists():
                  data = single.read_text()
              else:
                  raise SystemExit(f'missing payload for {stem}')
              return gzip.decompress(base64.b64decode(data.strip()))
          pathlib.Path('public/cj/index.html').write_bytes(load_payload('cj-index.html'))
          pathlib.Path('public/simon/index.html').write_bytes(load_payload('simon-index.html'))
          print('cj bytes', pathlib.Path('public/cj/index.html').stat().st_size)
          print('simon bytes', pathlib.Path('public/simon/index.html').stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cj/index.html public/simon/index.html
          git diff --cached --quiet || git commit -m "feat: inflate CJ and Simon demo HTML pages"
          git push
